<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dramatic Highland mountain ridges">
  <defs>
    <linearGradient id="hl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081C15"/>
      <stop offset="0.55" stop-color="#163A2B"/>
      <stop offset="1" stop-color="#2D6A4F"/>
    </linearGradient>
    <radialGradient id="hl-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D8F3DC" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#95D5B2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#95D5B2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#hl-sky)"/>
  <circle cx="1180" cy="250" r="240" fill="url(#hl-sun)"/>
  <!-- towering far peaks -->
  <path d="M0,520 L260,300 L460,520 L700,250 L980,520 L1200,340 L1420,520 L1600,420 L1600,900 L0,900 Z" fill="#2D6A4F" opacity="0.5"/>
  <rect x="0" y="500" width="1600" height="120" fill="#95D5B2" opacity="0.10"/>
  <!-- mid peaks -->
  <path d="M0,640 L300,430 L540,650 L820,400 L1080,650 L1340,470 L1600,620 L1600,900 L0,900 Z" fill="#1B4332" opacity="0.92"/>
  <!-- foreground ridge with deep glen -->
  <path d="M0,780 L260,600 L520,800 L760,560 L1040,800 L1320,620 L1600,760 L1600,900 L0,900 Z" fill="#081C15"/>
  <rect x="0" y="730" width="1600" height="90" fill="#D8F3DC" opacity="0.06"/>
</svg>
